<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <!-- 1. Viewport 設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人簡介 - Đặng Như Quỳnh</title>

  <!-- Google Fonts：Nunito / Fredoka (Latin) + Zen Maru Gothic (中文) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       Claymorphism design tokens — all colors & fonts live on :root
       ========================================================= */
    :root {
      /* 背景與粉彩色盤 */
      --color-bg: #EEF2FF;
      --color-bg-halo: #E0E7FF;
      --color-yellow: #FDE68A;
      --color-mint: #A7F3D0;
      --color-indigo: #C7D2FE;
      --color-pink: #FBCFE8;
      --color-white: #FFFFFF;
      --color-clear: rgba(255, 255, 255, 0);
      --color-highlight: rgba(255, 255, 255, 0.72);

      /* 文字 */
      --color-text: #312E81;
      --color-text-soft: #4F46E5;
      --color-heading: #4338CA;
      --color-focus: #F59E0B;

      /* 陰影顏色（含指定的內陰影數值） */
      --color-shadow-outer: rgba(99, 102, 241, 0.25);
      --color-shadow-inset-dark: rgba(0, 0, 0, 0.08);
      --color-shadow-inset-light: rgba(255, 255, 255, 0.7);

      /* 蓬鬆立體陰影 */
      --shadow-clay:
        8px 8px 24px var(--color-shadow-outer),
        inset -6px -6px 12px var(--color-shadow-inset-dark),
        inset 6px 6px 12px var(--color-shadow-inset-light);
      --shadow-clay-sm:
        5px 5px 14px var(--color-shadow-outer),
        inset -4px -4px 8px var(--color-shadow-inset-dark),
        inset 4px 4px 8px var(--color-shadow-inset-light);
      --shadow-clay-lg:
        10px 10px 28px var(--color-shadow-outer),
        inset -8px -8px 16px var(--color-shadow-inset-dark),
        inset 8px 8px 16px var(--color-shadow-inset-light);

      /* 字型：拉丁字母圓潤、中文圓潤 */
      --font-body: "Nunito", "Zen Maru Gothic", sans-serif;
      --font-display: "Fredoka", "Zen Maru Gothic", sans-serif;

      /* 形狀與動畫 */
      --radius-card: 32px;
      --radius-pill: 999px;
      --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* 基本重設與邊界控制（防止左右捲動） */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden; /* 防止左右捲動 */
    }

    body {
      min-height: 100vh;
      background-color: var(--color-bg);
      background-image: radial-gradient(circle at 15% 5%, var(--color-bg-halo), var(--color-clear) 45%);
      color: var(--color-text);
      font-family: var(--font-body);
      /* 4. 內文至少 16px、行距 1.6 */
      font-size: 16px;
      line-height: 1.7;
      font-weight: 600;
      -webkit-font-smoothing: antialiased;
    }

    :focus-visible {
      outline: 3px solid var(--color-focus);
      outline-offset: 4px;
    }

    /* 2. 手機優先 (Mobile First - 預設 375px 寬度適應)，768px 以上限制 max-width 720px 並置中 */
    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      padding: 24px 20px;
      margin: 0 auto;
    }

    @media (min-width: 768px) {
      .container {
        max-width: 720px;
        padding: 48px 20px;
      }
    }

    /* 背景漂浮的 3D 軟糖球 */
    .blobs {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .blob {
      position: absolute;
      display: block;
      box-shadow: var(--shadow-clay-lg);
      opacity: 0.85;
      animation: blob-float 9s ease-in-out infinite;
      will-change: transform;
    }

    .blob--1 {
      width: 168px;
      height: 168px;
      top: 12%;
      left: -62px;
      border-radius: 42% 58% 64% 36% / 51% 42% 58% 49%;
      background: radial-gradient(circle at 30% 24%, var(--color-highlight), var(--color-clear) 62%), var(--color-pink);
    }

    .blob--2 {
      width: 132px;
      height: 132px;
      top: 34%;
      right: -48px;
      border-radius: 60% 40% 38% 62% / 44% 58% 42% 56%;
      background: radial-gradient(circle at 32% 26%, var(--color-highlight), var(--color-clear) 62%), var(--color-mint);
      animation-delay: -3s;
    }

    .blob--3 {
      width: 116px;
      height: 116px;
      bottom: 6%;
      left: 6%;
      border-radius: 38% 62% 55% 45% / 58% 38% 62% 42%;
      background: radial-gradient(circle at 30% 25%, var(--color-highlight), var(--color-clear) 62%), var(--color-indigo);
      animation-delay: -6s;
    }

    @keyframes blob-float {
      0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
      50% { transform: translate3d(12px, -20px, 0) rotate(12deg); }
    }

    @media (min-width: 768px) {
      .blob--1 { width: 230px; height: 230px; left: 2%; top: 14%; }
      .blob--2 { width: 180px; height: 180px; right: 4%; top: 38%; }
      .blob--3 { width: 150px; height: 150px; left: 14%; bottom: 9%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .blob { animation: none; }
      .btn-contact, .btn-contact svg, .email-pill, .exp-card { transition-duration: 0.01ms; }
    }

    /* 通用標題樣式 - 4. 標題 24px 以上 */
    h1 {
      font-family: var(--font-display);
      font-size: 30px;
      font-weight: 700;
      line-height: 1.3;
      letter-spacing: 0.5px;
      color: var(--color-heading);
      margin-bottom: 8px;
    }

    h2 {
      position: relative;
      font-family: var(--font-display);
      font-size: 24px;
      font-weight: 600;
      color: var(--color-heading);
      margin-bottom: 22px;
      padding-bottom: 16px;
    }

    /* 胖胖的膠囊替代傳統細線底線 */
    h2::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;
      width: 64px;
      height: 12px;
      border-radius: var(--radius-pill);
      background: var(--color-pink);
      box-shadow: var(--shadow-clay-sm);
    }

    @media (min-width: 768px) {
      h1 { font-size: 38px; }
      h2 { font-size: 27px; }
    }

    /* 各區塊外距 */
    section {
      margin-bottom: 36px;
    }

    /* 3. 順序：名字＋一句介紹 */
    .hero {
      position: relative;
      text-align: center;
      padding: 34px 18px 36px;
      border-radius: var(--radius-card);
      background: radial-gradient(circle at 28% 18%, var(--color-highlight), var(--color-clear) 58%), var(--color-indigo);
      margin-bottom: 40px;
      box-shadow: var(--shadow-clay);
    }

    /* 圓滾滾的裝飾小圖示 */
    .hero::before {
      content: "";
      display: block;
      width: 52px;
      height: 52px;
      margin: 0 auto 14px;
      border-radius: 42% 58% 64% 36% / 52% 42% 58% 48%;
      background: radial-gradient(circle at 30% 24%, var(--color-highlight), var(--color-clear) 60%), var(--color-yellow);
      box-shadow: var(--shadow-clay-sm);
    }

    .hero .tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      font-family: var(--font-display);
      font-size: 15px;
      background: radial-gradient(circle at 28% 22%, var(--color-highlight), var(--color-clear) 60%), var(--color-yellow);
      color: var(--color-text);
      padding: 4px 22px;
      border-radius: var(--radius-pill);
      font-weight: 600;
      margin-bottom: 14px;
      box-shadow: var(--shadow-clay-sm);
    }

    .hero p.tagline {
      font-size: 18px;
      font-weight: 700;
      color: var(--color-text-soft);
      margin-top: 10px;
    }

    /* 關於我 (About) */
    .about-info {
      background: radial-gradient(circle at 22% 20%, var(--color-highlight), var(--color-clear) 55%), var(--color-mint);
      padding: 24px;
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-clay);
    }

    .about-info p + p {
      margin-top: 8px;
    }

    /* 會的東西 (Skills) */
    .skills-list {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      list-style: none;
    }

    .skill-item {
      --skill-bg: var(--color-yellow);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      background: radial-gradient(circle at 28% 22%, var(--color-highlight), var(--color-clear) 60%), var(--skill-bg);
      color: var(--color-text);
      padding: 8px 20px;
      border-radius: var(--radius-card);
      font-weight: 700;
      font-size: 16px;
      box-shadow: var(--shadow-clay-sm);
    }

    .skill-item:nth-child(4n + 2) { --skill-bg: var(--color-mint); }
    .skill-item:nth-child(4n + 3) { --skill-bg: var(--color-indigo); }
    .skill-item:nth-child(4n + 4) { --skill-bg: var(--color-pink); }

    /* 做過的事 (Experience) - 手機版單欄 */
    .experience-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    /* 2. 螢幕 768px 以上，經歷改兩欄 */
    @media (min-width: 768px) {
      .experience-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .exp-card {
      --card-bg: var(--color-pink);
      background: radial-gradient(circle at 24% 18%, var(--color-highlight), var(--color-clear) 55%), var(--card-bg);
      padding: 22px;
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-clay);
      transition: box-shadow 0.25s ease, transform 0.32s var(--ease-bounce);
    }

    .exp-card:nth-child(even) { --card-bg: var(--color-mint); }

    .exp-card:hover {
      box-shadow: var(--shadow-clay-lg);
      transform: translateY(-4px);
    }

    .exp-card h3 {
      font-family: var(--font-display);
      font-size: 19px;
      font-weight: 700;
      color: var(--color-heading);
      margin-bottom: 6px;
    }

    .exp-card .exp-desc {
      color: var(--color-text-soft);
      font-size: 16px;
      font-weight: 600;
    }

    /* 5. 按鈕至少 44px 高、聯絡我區塊 */
    .contact-section {
      text-align: center;
      margin-top: 44px;
      margin-bottom: 20px;
    }

    .btn-contact {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 56px; /* 規格規定至少 44px 高 */
      padding: 0 32px;
      background: radial-gradient(circle at 28% 20%, var(--color-highlight), var(--color-clear) 58%), var(--color-yellow);
      color: var(--color-heading);
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      text-decoration: none;
      border: none;
      border-radius: var(--radius-card);
      cursor: pointer;
      width: 100%;
      max-width: 280px;
      box-shadow: var(--shadow-clay-lg);
      transition: transform 0.32s var(--ease-bounce), box-shadow 0.25s ease;
    }

    /* 粗線條、圓頭圓角的按鈕圖示 */
    .btn-contact svg {
      width: 22px;
      height: 22px;
      flex: none;
      margin-left: 10px;
      transition: transform 0.32s var(--ease-bounce);
    }

    .btn-contact:hover {
      transform: translateY(-3px);
    }

    /* 按下去略微扁掉，放開後彈回 */
    .btn-contact:active {
      transform: scale(0.96);
      box-shadow: var(--shadow-clay-sm);
    }

    .btn-contact:active svg {
      transform: translateX(3px);
    }

    /* 信箱膠囊 */
    .email-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      max-width: 100%;
      margin-top: 16px;
      padding: 8px 20px;
      border-radius: var(--radius-pill);
      background: radial-gradient(circle at 28% 22%, var(--color-highlight), var(--color-clear) 60%), var(--color-mint);
      color: var(--color-text);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      word-break: break-all;
      box-shadow: var(--shadow-clay-sm);
      transition: transform 0.32s var(--ease-bounce);
    }

    .email-pill svg {
      width: 18px;
      height: 18px;
      flex: none;
      margin-right: 8px;
    }

    .email-pill:hover {
      transform: translateY(-2px);
    }

    .email-pill:active {
      transform: scale(0.96);
    }

    /* 圖片與媒體控制，確保不超出螢幕 */
    img, video {
      max-width: 100%;
      height: auto;
      border-radius: var(--radius-card);
    }
  </style>
</head>
<body>

  <!-- 背景漂浮軟糖球（純裝飾） -->
  <div class="blobs" aria-hidden="true">
    <span class="blob blob--1"></span>
    <span class="blob blob--2"></span>
    <span class="blob blob--3"></span>
  </div>

  <main class="container">
    
    <!-- 順序 1: 名字 ＋ 一句話介紹 -->
    <header class="hero">
      <!-- 請在此填寫：科系年級 -->
      <span class="tag">待確認</span>
      <!-- 請在此填寫：名字 -->
      <h1>Đặng Như Quỳnh</h1>
      <!-- 請在此填寫：一句話介紹自己 -->
      <p class="tagline">「待確認」</p>
    </header>

    <!-- 順序 2: 關於我 -->
    <section>
      <h2>關於我</h2>
      <div class="about-info">
        <!-- 請在此填寫詳細自我介紹 -->
        <p>科系：待確認</p>
        <p>自我介紹：我是 Đặng Như Quỳnh，目前為在學學生，其他詳細背景與經歷待確認。</p>
      </div>
    </section>

    <!-- 順序 3: 會的東西 -->
    <section>
      <h2>會的東西</h2>
      <ul class="skills-list">
        <!-- 請在此修改或新增您的技能標籤 -->
        <li class="skill-item">待確認</li>
      </ul>
    </section>

    <!-- 順序 4: 做過的事 (手機單欄，768px 以上兩欄) -->
    <section>
      <h2>做過的事</h2>
      <div class="experience-grid">
        <!-- 經歷 1 -->
        <div class="exp-card">
          <h3>1. 待確認</h3>
          <p class="exp-desc">待確認</p>
        </div>
      </div>
    </section>

    <!-- 順序 5: 聯絡我按鈕 -->
    <section class="contact-section">
      <!-- 聯絡 Email -->
      <a href="mailto:b11307031@gapps.knu.edu.tw" class="btn-contact">聯絡我<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h13M13 6l6 6-6 6"/></svg></a>
      <a href="mailto:b11307031@gapps.knu.edu.tw" class="email-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>b11307031@gapps.knu.edu.tw</a>
    </section>

  </main>

</body>
</html>
